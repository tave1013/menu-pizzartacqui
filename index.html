    <style>
      /* Nascondi la barra e UI di Google Translate */
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame,

      /* Font tags non devono alterare lo stile */
      font { 
        font-family: inherit !important;
        background-color: transparent !important;
      }
      
      /* Fix margini html tradotto */
      html.translated-ltr,
      html.translated-rtl {
