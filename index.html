    <!-- Google Translate -->
    <style>
      /* Hide Google Translate widget but keep it functional */
      .goog-te-banner-frame, .skiptranslate, #goog-gt-tt, .goog-te-balloon-frame {
        display: none !important;
      }
      body { top: 0 !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    
    <!-- Hidden Google Translate element -->
    <div id="google_translate_element" style="display: none;"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Google Translate Script -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'it',
          includedLanguages: 'it,en,fr,de,es',
          autoDisplay: false,
          multilanguagePage: true
        }, 'google_translate_element');
      }
      
      // Function to change language programmatically
      window.changeGoogleTranslateLanguage = function(langCode) {
        var frame = document.querySelector('.goog-te-menu-frame');
        if (!frame) {
          // Wait for Google Translate to load
          setTimeout(function() { window.changeGoogleTranslateLanguage(langCode); }, 100);
          return;
        }
        
        var frameDoc = frame.contentWindow.document;
        var langElements = frameDoc.querySelectorAll('.goog-te-menu2-item span.text');
        
        var langMap = {
          'it': 'Italiano',
          'en': 'English', 
          'fr': 'Français',
          'de': 'Deutsch',
          'es': 'Español'
        };
        
        langElements.forEach(function(el) {
          if (el.textContent === langMap[langCode]) {
            el.click();
          }
        });
      };
      
      // Reset to original language
      window.resetGoogleTranslate = function() {
        var select = document.querySelector('.goog-te-combo');
        if (select) {
          select.value = '';
          select.dispatchEvent(new Event('change'));
        }
      };
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
